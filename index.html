<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather App</title>

<link href="https://fonts.googleapis.com/css2?family=Product+Sans:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    background: linear-gradient(180deg, #6b8cff, #8e7bff);
    color: #fff;
    display: flex;
    justify-content: center;
    padding: 30px;
}

.app {
    width: 100%;
    max-width: 1200px;
}

/* SEARCH */
.search {
    display: flex;
    gap: 12px;
    margin-bottom: 25px;
}

.search input {
    flex: 1;
    padding: 14px 18px;
    border-radius: 30px;
    border: none;
    font-size: 16px;
}

.search button {
    padding: 14px 24px;
    border-radius: 30px;
    border: none;
    background: white;
    color: #5b5be0;
    font-weight: bold;
    cursor: pointer;
}

/* CURRENT WEATHER */
.current {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 30px;
}

.temp {
    font-size: 64px;
    font-weight: bold;
}

.city {
    font-size: 20px;
    opacity: 0.9;
}

.condition {
    font-size: 18px;
    opacity: 0.85;
}

/* HOURLY */
.section-title {
    margin: 20px 0 10px;
    font-weight: bold;
}

.hourly {
    display: flex;
    gap: 15px;
    overflow-x: auto;
    padding-bottom: 10px;
}

.hour {
    min-width: 80px;
    background: rgba(255,255,255,0.2);
    padding: 12px;
    border-radius: 16px;
    text-align: center;
}

/* FORECAST */
.forecast {
    margin-top: 30px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
}

.day {
    background: rgba(255,255,255,0.2);
    padding: 20px;
    border-radius: 18px;
    text-align: center;
}

.day span {
    display: block;
    margin-top: 6px;
}

/* ================= MOBILE ================= */
@media (max-width: 600px) {

    body {
        padding: 15px;
    }

    .search {
        flex-direction: column;
    }

    .search button {
        width: 100%;
    }

    .current {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
    }

    .temp {
        font-size: 46px;
    }

    #icon {
        font-size: 60px !important;
        align-self: center;
    }

    .forecast {
        grid-template-columns: 1fr;
    }

    .hour {
        min-width: 70px;
        font-size: 14px;
    }
}
</style>
</head>

<body>

<div class="app">

    <div class="search">
        <input type="text" id="locationInput" placeholder="Search city">
        <button onclick="getWeather()">Search</button>
    </div>

    <div class="current">
        <div>
            <div class="temp" id="temp">--°C</div>
            <div class="condition" id="condition">--</div>
            <div class="city" id="city">--</div>
        </div>
        <div style="font-size:80px" id="icon">🌤️</div>
    </div>

    <div class="section-title">Hourly Forecast</div>
    <div class="hourly" id="hourly"></div>

    <div class="section-title">3-Day Forecast</div>
    <div class="forecast" id="forecast"></div>

</div>

<script>
const apiKey = "db46f3816d4d4b9bb94171026252412";

window.onload = () => getWeather("Kolkata");

function getWeather(defaultCity) {
    const city = defaultCity || document.getElementById("locationInput").value || "Kolkata";

    fetch(`https://api.weatherapi.com/v1/forecast.json?key=${apiKey}&q=${city}&days=3`)
        .then(res => res.json())
        .then(data => {

            temp.innerText = `${data.current.temp_c}°C`;
            condition.innerText = data.current.condition.text;
            city.innerText = `${data.location.name}, ${data.location.country}`;

            const text = data.current.condition.text.toLowerCase();
            icon.innerText =
                text.includes("rain") ? "🌧️" :
                text.includes("cloud") ? "☁️" :
                text.includes("sun") ? "☀️" :
                "🌤️";

            hourly.innerHTML = "";
            data.forecast.forecastday[0].hour.slice(6, 18).forEach(h => {
                hourly.innerHTML += `
                    <div class="hour">
                        ${h.time.split(" ")[1]}<br>
                        ${h.temp_c}°C
                    </div>
                `;
            });

            forecast.innerHTML = "";
            data.forecast.forecastday.forEach(d => {
                forecast.innerHTML += `
                    <div class="day">
                        <strong>${new Date(d.date).toDateString().slice(0,3)}</strong>
                        <span>${d.day.condition.text}</span>
                        <span>${d.day.maxtemp_c}° / ${d.day.mintemp_c}°</span>
                    </div>
                `;
            });
        });
}
</script>

</body>
</html>
