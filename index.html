<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Weather App</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #667eea, #764ba2);
    overflow: hidden;
    position: relative;
}

/* 🌸 Soft background blobs to fill empty space */
body::before,
body::after {
    content: "";
    position: absolute;
    width: 320px;
    height: 320px;
    background: rgba(255, 255, 255, 0.18);
    border-radius: 50%;
    filter: blur(110px);
    z-index: -1;
}

body::before {
    top: 15%;
    left: 12%;
}

body::after {
    bottom: 12%;
    right: 12%;
}

/* 🌦 Main Card */
.weather-container {
    width: 420px;
    padding: 32px 26px;
    border-radius: 24px;
    background: rgba(255, 255, 255, 0.25);
    backdrop-filter: blur(20px);
    box-shadow: 0 12px 40px rgba(0,0,0,0.35);
    color: #fff;
    text-align: center;
    animation: fadeUp 0.7s ease;
}

h2 {
    margin-bottom: 18px;
    font-weight: 600;
}

/* Input */
input {
    width: 100%;
    padding: 14px;
    border-radius: 16px;
    border: none;
    outline: none;
    font-size: 15px;
    margin-bottom: 14px;
}

/* Button */
button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 16px;
    background: #ffffff;
    color: #5a4fcf;
    font-weight: 600;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.3);
}

/* Weather Data */
.weather-main {
    margin-top: 26px;
    display: none;
}

.weather-icon {
    font-size: 78px;
    margin-bottom: 8px;
}

#temp {
    font-size: 40px;
    font-weight: 600;
}

#condition {
    font-size: 16px;
    opacity: 0.9;
    margin-top: 4px;
}

#city {
    font-size: 18px;
    margin-top: 8px;
    font-weight: 500;
}

/* Info Grid */
.info-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    margin-top: 26px;
}

.info-box {
    background: rgba(255,255,255,0.28);
    padding: 14px 10px;
    border-radius: 16px;
    font-size: 13px;
}

.info-box span {
    display: block;
    font-size: 16px;
    font-weight: 600;
    margin-top: 4px;
}

/* Animation */
@keyframes fadeUp {
    from {
        opacity: 0;
        transform: translateY(14px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}
</style>
</head>

<body>

<div class="weather-container">
    <h2>🌦 Weather App</h2>

    <input type="text" id="locationInput" placeholder="Enter city name">
    <button onclick="getWeather()">Get Weather</button>

    <div class="weather-main" id="weatherMain">
        <div class="weather-icon" id="icon">🌤️</div>
        <p id="temp"></p>
        <p id="condition"></p>
        <p id="city"></p>

        <div class="info-grid">
            <div class="info-box">
                Humidity
                <span id="humidity">--%</span>
            </div>
            <div class="info-box">
                Wind
                <span id="wind">-- km/h</span>
            </div>
            <div class="info-box">
                Feels Like
                <span id="feels">--°C</span>
            </div>
        </div>
    </div>
</div>

<script>
function getWeather() {
    const location = document.getElementById("locationInput").value.trim();
    if (!location) {
        alert("Please enter a city name");
        return;
    }

    const apiKey = "db46f3816d4d4b9bb94171026252412";
    const url = `https://api.weatherapi.com/v1/current.json?key=${apiKey}&q=${location}&aqi=yes`;

    fetch(url)
        .then(res => res.json())
        .then(data => {
            if (data.error) {
                alert("City not found");
                return;
            }

            document.getElementById("weatherMain").style.display = "block";

            document.getElementById("temp").innerText =
                `${data.current.temp_c}°C`;

            document.getElementById("condition").innerText =
                data.current.condition.text;

            document.getElementById("city").innerText =
                `${data.location.name}, ${data.location.country}`;

            document.getElementById("humidity").innerText =
                `${data.current.humidity}%`;

            document.getElementById("wind").innerText =
                `${data.current.wind_kph} km/h`;

            document.getElementById("feels").innerText =
                `${data.current.feelslike_c}°C`;

            const text = data.current.condition.text.toLowerCase();
            const icon = document.getElementById("icon");

            if (text.includes("sun")) icon.innerText = "☀️";
            else if (text.includes("rain")) icon.innerText = "🌧️";
            else if (text.includes("cloud")) icon.innerText = "☁️";
            else if (text.includes("snow")) icon.innerText = "❄️";
            else icon.innerText = "🌤️";
        })
        .catch(() => alert("Network error"));
}
</script>

</body>
</html>
