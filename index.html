<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Weather App</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #667eea, #764ba2);
    display: flex;
    justify-content: center;
    align-items: center;
}

/* 🔥 FULL-WIDTH APP CONTAINER */
.app-wrapper {
    width: 90%;
    max-width: 1100px;
    background: rgba(255,255,255,0.25);
    backdrop-filter: blur(18px);
    border-radius: 28px;
    padding: 40px;
    box-shadow: 0 15px 50px rgba(0,0,0,0.35);
    color: #fff;
}

/* HEADER */
.header {
    text-align: center;
    margin-bottom: 30px;
}

.header h2 {
    font-weight: 600;
}

/* SEARCH */
.search {
    display: flex;
    gap: 15px;
    justify-content: center;
    margin-bottom: 40px;
}

.search input {
    width: 260px;
    padding: 14px;
    border-radius: 16px;
    border: none;
    outline: none;
}

.search button {
    padding: 14px 24px;
    border-radius: 16px;
    border: none;
    background: #fff;
    color: #5a4fcf;
    font-weight: 600;
    cursor: pointer;
}

/* MAIN WEATHER AREA */
.weather-content {
    display: grid;
    grid-template-columns: 1fr 1fr;
    align-items: center;
    gap: 40px;
}

.left {
    text-align: center;
}

.weather-icon {
    font-size: 100px;
}

#temp {
    font-size: 48px;
    font-weight: 600;
}

#condition {
    opacity: 0.9;
}

.right {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
}

.info-box {
    background: rgba(255,255,255,0.3);
    padding: 20px;
    border-radius: 18px;
    text-align: center;
}

.info-box span {
    display: block;
    font-size: 20px;
    font-weight: 600;
    margin-top: 6px;
}

/* RESPONSIVE */
@media (max-width: 768px) {
    .weather-content {
        grid-template-columns: 1fr;
        text-align: center;
    }

    .right {
        grid-template-columns: 1fr 1fr;
    }
}
</style>
</head>

<body>

<div class="app-wrapper">

    <div class="header">
        <h2>🌦 Weather App</h2>
    </div>

    <div class="search">
        <input type="text" id="locationInput" placeholder="Enter city name">
        <button onclick="getWeather()">Get Weather</button>
    </div>

    <div class="weather-content" id="weatherMain" style="display:none;">
        <div class="left">
            <div class="weather-icon" id="icon">🌤️</div>
            <p id="temp"></p>
            <p id="condition"></p>
            <p id="city"></p>
        </div>

        <div class="right">
            <div class="info-box">
                Humidity
                <span id="humidity">--%</span>
            </div>
            <div class="info-box">
                Wind
                <span id="wind">-- km/h</span>
            </div>
            <div class="info-box">
                Feels Like
                <span id="feels">--°C</span>
            </div>
        </div>
    </div>

</div>

<script>
function getWeather() {
    const location = document.getElementById("locationInput").value.trim();
    if (!location) return alert("Enter a city name");

    const apiKey = "db46f3816d4d4b9bb94171026252412";
    const url = `https://api.weatherapi.com/v1/current.json?key=${apiKey}&q=${location}`;

    fetch(url)
        .then(res => res.json())
        .then(data => {
            if (data.error) return alert("City not found");

            document.getElementById("weatherMain").style.display = "grid";

            temp.innerText = `${data.current.temp_c}°C`;
            condition.innerText = data.current.condition.text;
            city.innerText = `${data.location.name}, ${data.location.country}`;
            humidity.innerText = `${data.current.humidity}%`;
            wind.innerText = `${data.current.wind_kph} km/h`;
            feels.innerText = `${data.current.feelslike_c}°C`;

            const text = data.current.condition.text.toLowerCase();
            icon.innerText =
                text.includes("rain") ? "🌧️" :
                text.includes("cloud") ? "☁️" :
                text.includes("sun") ? "☀️" :
                "🌤️";
        });
}
</script>

</body>
</html>
